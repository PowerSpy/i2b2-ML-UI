[pytest]
markers =
    live: needs the i2b2 stack running. Skips when it is not there.

# `live` runs by default, and that is deliberate. The dictionary's SQL was
# unit-tested, passing, and wrong about every categorical column in the
# database; only a real warehouse found it. Excluding those tests by default
# would restore exactly the blind spot that hid the bug.
#
# They skip cleanly with the stack down, so this stays usable offline - but a
# green run that skipped them has not checked the half that has historically
# been wrong. To skip them explicitly:
#
#     pytest -m "not live"
